<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Generator Tuan</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --container-bg: #282a36;
            --text-color: #f8f8f2;
            --accent-color: #bd93f9;
            --button-hover: #ff79c6;
            --border-color: #44475a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        select, textarea, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #1e1e2e;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            margin-top: 10px;
            font-family: monospace;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            margin-top: 20px;
            background-color: var(--accent-color);
            color: #282a36;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
        }

        button:hover {
            background-color: var(--button-hover);
            color: #fff;
        }

        .output-container {
            margin-top: 30px;
            background-color: #000;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        pre {
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #50fa7b;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pusat Pembuat Kode 🤖</h2>
        
        <label for="contohPrompt">Pilih Contoh Prompt (Opsional):</label>
        <select id="contohPrompt" onchange="isiPromptSesuaiContoh()">
            <option value="">-- Silakan Pilih Contoh Prompt --</option>
            <option value="cpp">Buatkan kerangka permainan tebak angka sederhana dalam bahasa C++</option>
            <option value="html">Buatkan tombol dengan efek bayangan menyala (glow) menggunakan HTML dan CSS</option>
            <option value="python">Buatkan skrip Python untuk mencari bilangan prima dari 1 sampai 100</option>
        </select>

        <label for="inputPrompt">Tuliskan Perintah Tuan di Sini:</label>
        <textarea id="inputPrompt" placeholder="Contoh: Buatkan saya kode untuk membuat menu navigasi..."></textarea>

        <button onclick="generateKode()">Hasilkan Kode ⚡</button>

        <label>Hasil Kode:</label>
        <div class="output-container">
            <pre><code id="outputArea">// Hasil kode akan ditampilkan di sini, Tuan...</code></pre>
        </div>
    </div>

    <script>
        // Data simulasi respons untuk contoh prompt
        const databaseKode = {
            "cpp": `#include <iostream>\nusing namespace std;\n\nint main() {\n    int tebakan;\n    int jawaban = 7;\n    cout << "Tebak angka dari 1-10: ";\n    cin >> tebakan;\n    if (tebakan == jawaban) {\n        cout << "Benar!" << endl;\n    } else {\n        cout << "Salah, coba lagi!" << endl;\n    }\n    return 0;\n}`,
            "html": `<style>\n.btn-glow {\n  background: #bd93f9;\n  color: white;\n  padding: 15px 30px;\n  border: none;\n  border-radius: 5px;\n  cursor: pointer;\n  transition: 0.3s;\n}\n.btn-glow:hover {\n  box-shadow: 0 0 15px #bd93f9;\n}\n</style>\n\n<button class="btn-glow">Klik Saya</button>`,
            "python": `for num in range(1, 101):\n    if num > 1:\n        for i in range(2, num):\n            if (num % i) == 0:\n                break\n        else:\n            print(num)`
        };

        // Fungsi untuk mengisi textarea saat Tuan memilih dari dropdown
        function isiPromptSesuaiContoh() {
            const dropdown = document.getElementById("contohPrompt");
            const textArea = document.getElementById("inputPrompt");
            
            // Jika memilih opsi, teks prompt akan otomatis terisi
            if (dropdown.options[dropdown.selectedIndex].value !== "") {
                textArea.value = dropdown.options[dropdown.selectedIndex].text;
            } else {
                textArea.value = "";
            }
        }

        // Fungsi untuk menyimulasikan pembuatan kode
        function generateKode() {
            const dropdownValue = document.getElementById("contohPrompt").value;
            const inputPromptValue = document.getElementById("inputPrompt").value;
            const outputArea = document.getElementById("outputArea");

            if (inputPromptValue.trim() === "") {
                outputArea.textContent = "// Mohon maaf Tuan, silakan masukkan prompt terlebih dahulu. ⚠️";
                outputArea.style.color = "#ff5555";
                return;
            }

            // Animasi memuat (loading)
            outputArea.style.color = "#8be9fd";
            outputArea.textContent = "// Sedang memproses permintaan Tuan... ⏳";

            // Menggunakan setTimeout untuk menyimulasikan waktu tunggu API
            setTimeout(() => {
                outputArea.style.color = "#50fa7b";
                
                // Jika prompt sesuai dengan dropdown, tampilkan kode yang sudah disiapkan
                if (dropdownValue && inputPromptValue === document.getElementById("contohPrompt").options[document.getElementById("contohPrompt").selectedIndex].text) {
                    outputArea.textContent = databaseKode[dropdownValue];
                } else {
                    // Jika prompt diketik manual (belum terhubung API nyata)
                    outputArea.textContent = "// Ini adalah simulasi hasil untuk prompt Tuan:\\n// \\"" + inputPromptValue + "\\"\\n\\n// Untuk membuat fungsi ini nyata, Tuan perlu mengintegrasikan skrip ini dengan API AI (seperti Gemini API). 🛠️";
                }
            }, 1500); // Waktu tunggu 1.5 detik
        }
    </script>
</body>
</html>
